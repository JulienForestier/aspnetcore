name: SonarQube Full Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache SonarScanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: |
            ${{ runner.os }}-sonar-scanner

      - name: Install SonarScanner
        shell: powershell
        run: |
          New-Item -Path $env:TEMP\scanner -ItemType Directory -Force
          dotnet tool install dotnet-sonarscanner --tool-path $env:TEMP\scanner --ignore-failed-sources

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $scanner = "$env:TEMP\scanner\dotnet-sonarscanner"

          # Début de l'analyse Sonar
          & $scanner begin /k:"JulienForestier_aspnetcore2" /o:"julienforestier" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="$env:SONAR_TOKEN"

          # Build de la solution principale
          dotnet restore AspNetCore.slnx
          dotnet build AspNetCore.slnx -c Release --no-restore

          # Fin de l'analyse Sonar
          & $scanner end /d:sonar.token="$env:SONAR_TOKEN"
